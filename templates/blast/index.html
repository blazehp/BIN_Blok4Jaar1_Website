{% extends 'layout.html' %}

{% block meta %}
    <link rel="stylesheet" href="/static/styles/blast.css">
{% endblock %}

{% block title %}BLAST PICKER{% endblock %}

{% block header %}
    <h3>BLAST PICKER</h3>
{% endblock %}

{% block content %}
    <main>
        <section class="blast-page-picker">
            <a href="/200seq_blast" class="picker-card">
                <span class="picker-icon">🧬</span>
                <span class="picker-title">200 Sequences</span>
                <span class="picker-sub">Browse pre-computed BLAST hits</span>
            </a>

            <a href="/self-blast" class="picker-card">
                <span class="picker-icon">🔬</span>
                <span class="picker-title">Self BLAST</span>
                <span class="picker-sub">Run a sequence against the set</span>
            </a>
        </section>
    </main>
{% endblock %}
